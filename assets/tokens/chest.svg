  <!-- lid -->
  <path d="M18 58c0-18 12-34 46-34s46 16 46 34H18z" fill="url(#lid)" stroke="#2a1608" stroke-width="2.5"/>
  <path d="M28 48c8-12 24-18 36-18s28 6 36 18" fill="none" stroke="#f0d0a0" stroke-opacity=".25" stroke-width="3"/>
  <!-- metal bands -->
  <rect x="20" y="54" width="88" height="8" rx="2" fill="url(#metal)" stroke="#4a3810" stroke-width="1.2"/>
  <rect x="30" y="96" width="68" height="6" rx="1.5" fill="url(#metal)" stroke="#4a3810" stroke-width="1"/>
  <!-- lock plate -->
  <rect x="54" y="62" width="20" height="22" rx="3" fill="url(#metal)" stroke="#4a3810" stroke-width="1.4"/>
  <circle cx="64" cy="72" r="4" fill="#3a2810"/>
  <path d="M64 76v6" stroke="#3a2810" stroke-width="2.5" stroke-linecap="round"/>
