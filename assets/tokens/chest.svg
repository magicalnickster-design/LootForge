<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c48a48"/>
      <stop offset="45%" stop-color="#8a5528"/>
      <stop offset="100%" stop-color="#4a2c14"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a060"/>
      <stop offset="100%" stop-color="#6a3c18"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c860"/>
      <stop offset="100%" stop-color="#8a6820"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="112" rx="42" ry="8" fill="#000" opacity=".28"/>
  <!-- body -->
  <path d="M22 58h84v42c0 6-4 10-10 10H32c-6 0-10-4-10-10V58z" fill="url(#wood)" stroke="#2a1608" stroke-width="2.5"/>
